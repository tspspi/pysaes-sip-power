[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "pysaes-sip-power-tspspi"
dynamic = ["version"]
description = "SAES SIP POWER ion pump and pressure gauge Modbus driver with MQTT publisher (unofficial)"
authors = [{name = "Thomas Spielauer", email = "pypipackages01@tspi.at"}]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.8"
dependencies = ["pylabdevs-tspspi>=0.0.19", "pyserial>=3.5", "paho-mqtt>=2.0"]

[project.scripts]
sippowermqtt = "saessippower.mqttdaemon:main"

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
